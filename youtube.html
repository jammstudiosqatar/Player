<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player</title>
<style>
  :root{
    --accent:#FF196D;
    --track:rgba(255,255,255,.22);
    --text:rgba(255,255,255,.8);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 
  #wrap{display:flex;flex-direction:column;width:100%;
        background:#000;border-radius:var(--radius);overflow:hidden}
 
  /* ---- video area: locked to 16:9 so it can never letterbox ---- */
  #video{position:relative;width:100%;aspect-ratio:16/9;flex:0 0 auto;background:#000}
  #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
 
  /* swallows clicks so nobody can reach youtube.com */
  #shield{position:absolute;inset:0;z-index:2;cursor:pointer}
 
  /* covers YouTube's branded idle/paused screen: title, logo, centre play */
  #cover{position:absolute;inset:0;z-index:3;cursor:pointer;
         display:flex;align-items:center;justify-content:center;
         background-size:cover;background-position:center;background-color:#000}
  #cover.scrim{background-image:none !important;background-color:rgba(0,0,0,.72)}
  #cover.hide{display:none}
  #cover::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
  .bigplay{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;
           background:var(--accent);display:flex;align-items:center;justify-content:center;
           box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .bigplay svg{margin-left:4px}
 
  /* ---- control strip, BELOW the video so nothing can bleed through ---- */
  #bar{flex:0 0 52px;display:flex;align-items:center;gap:12px;
       padding:0 14px;background:#0d0d0d}
  #toggle{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;
          background:var(--accent);display:flex;align-items:center;justify-content:center;
          cursor:pointer;padding:0}
  #scrub{position:relative;flex:1 1 auto;height:24px;display:flex;align-items:center;
         cursor:pointer;touch-action:none}
  #scrub .rail{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--track)}
  #scrub .fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent);width:0}
  #scrub .knob{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;
               left:0;margin-left:-6px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  #time{flex:0 0 auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
  #mute{flex:0 0 auto;width:26px;height:26px;border:0;background:none;cursor:pointer;
        padding:0;display:flex;align-items:center;justify-content:center;opacity:.8}
  #msg{display:flex;height:100%;align-items:center;justify-content:center;
       color:rgba(255,255,255,.55);font-size:13px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="wrap">
  <div id="video">
    <div id="yt"></div>
    <div id="shield"></div>
    <div id="cover">
      <div class="bigplay">
        <svg width="22" height="24" viewBox="0 0 24 26"><path fill="#fff" d="M23 11.3 3 .3A2 2 0 0 0 0 2v22a2 2 0 0 0 3 1.7l20-11a2 2 0 0 0 0-3.4Z"/></svg>
      </div>
    </div>
  </div>
  <div id="bar">
    <button id="toggle" aria-label="Play or pause">
      <svg width="13" height="14" viewBox="0 0 24 26"><path id="iconPath" fill="#fff" d="M23 11.3 3 .3A2 2 0 0 0 0 2v22a2 2 0 0 0 3 1.7l20-11a2 2 0 0 0 0-3.4Z"/></svg>
    </button>
    <div id="scrub"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
    <span id="time">0:00 / 0:00</span>
    <button id="mute" aria-label="Mute">
      <svg width="17" height="17" viewBox="0 0 24 24"><path id="mutePath" fill="#fff" d="M4 9v6h4l5 5V4L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
    </button>
  </div>
</div>
 
<script>
(function(){
  var q = new URLSearchParams(location.search);
 
  // Accepts a bare 11-char ID, or any YouTube URL form:
  //   youtu.be/ID · watch?v=ID · /embed/ID · /shorts/ID · /live/ID
  // Trailing junk like ?si=... or &t=30 is ignored.
  function toVideoId(raw){
    raw = (raw || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
    var m = raw.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }
 
  var VIDEO  = toVideoId(q.get('v'));
  var POSTER = q.get('poster');
  var ACCENT = q.get('accent');
  if (ACCENT) document.documentElement.style.setProperty('--accent', '#' + ACCENT.replace('#',''));
 
  var wrap   = document.getElementById('wrap');
  var cover  = document.getElementById('cover');
  var shield = document.getElementById('shield');
  var toggle = document.getElementById('toggle');
  var iconP  = document.getElementById('iconPath');
  var muteP  = document.getElementById('mutePath');
  var muteBt = document.getElementById('mute');
  var scrub  = document.getElementById('scrub');
  var fill   = scrub.querySelector('.fill');
  var knob   = scrub.querySelector('.knob');
  var timeEl = document.getElementById('time');
 
  if (!VIDEO){
    wrap.innerHTML = '<div id="msg">No video. Add ?v= a YouTube ID or link to this URL.</div>';
    return;
  }
 
  // maxres is missing on many uploads; hqdefault always exists
  cover.style.backgroundImage =
    "url('" + (POSTER || ('https://i.ytimg.com/vi/' + VIDEO + '/maxresdefault.jpg')) + "'), " +
    "url('https://i.ytimg.com/vi/" + VIDEO + "/hqdefault.jpg')";
 
  var PLAY  = 'M23 11.3 3 .3A2 2 0 0 0 0 2v22a2 2 0 0 0 3 1.7l20-11a2 2 0 0 0 0-3.4Z';
  var PAUSE = 'M2 0h6v26H2zM16 0h6v26h-6z';
  var SPK   = 'M4 9v6h4l5 5V4L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z';
  var MUTED = 'M4 9v6h4l5 5V4L8 9H4Zm16.5 0-1.4-1.4L17 9.7l-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4-2.1-2.1 2.1-2.1Z';
 
  var player, timer, dragging = false, everPlayed = false, apiDead = false;
 
  var vars = {
    controls: 0, rel: 0, iv_load_policy: 3, disablekb: 1, cc_load_policy: 0,
    playsinline: 1, fs: 0, modestbranding: 1, enablejsapi: 1
  };
  // In a sandboxed iframe (Glide) location.origin is the string "null", which the
  // YouTube API rejects silently. Only send it when it is a real origin.
  if (location.origin && location.origin !== 'null' && /^https?:/.test(location.origin)){
    vars.origin = location.origin;
  }
 
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function(){ fallback(); };
  document.head.appendChild(tag);
 
  // If the API never loads or never becomes ready, degrade to a plain embed
  // rather than leaving a play button that does nothing.
  var apiWatchdog = setTimeout(function(){
    if (!window.YT || !window.YT.Player || !player) fallback();
  }, 5000);
 
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('yt', {
      videoId: VIDEO,
      playerVars: vars,
      events: {
        onReady: function(){ clearTimeout(apiWatchdog); render(); },
        onStateChange: onState,
        onError: function(){ clearTimeout(apiWatchdog); fallback(); }
      }
    });
  };
 
  // Fallback: no JS control of the player is possible, so hand back YouTube's own
  // controls (colour=white keeps them quiet) and drop our dead control strip.
  function fallback(){
    if (apiDead) return;
    apiDead = true;
    clearTimeout(apiWatchdog); clearInterval(timer);
    document.getElementById('bar').style.display = 'none';
    var f = document.createElement('iframe');
    f.id = 'yt';
    f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
    f.setAttribute('allowfullscreen', '');
    f.src = 'https://www.youtube.com/embed/' + VIDEO +
            '?rel=0&iv_load_policy=3&playsinline=1&color=white&modestbranding=1';
    var slot = document.getElementById('yt');
    slot.parentNode.replaceChild(f, slot);
    shield.style.display = 'none';           // YouTube's controls need the clicks
    cover.onclick = function(){
      f.src += '&autoplay=1';
      cover.classList.add('hide');
    };
  }
 
  // YouTube paints its own branded screen (title, logo, big play button) on every
  // non-playing state. Cover it. Thumbnail before first play, dark scrim after.
  function onState(e){
    var S = YT.PlayerState;
    if (e.data === S.PLAYING){
      everPlayed = true;
      cover.classList.add('hide');
      iconP.setAttribute('d', PAUSE);
      clearInterval(timer); timer = setInterval(render, 250);
    } else if (e.data === S.PAUSED || e.data === S.ENDED ||
               e.data === S.UNSTARTED || e.data === S.CUED){
      if (everPlayed) cover.classList.add('scrim');
      cover.classList.remove('hide');
      iconP.setAttribute('d', PLAY);
      clearInterval(timer);
      render();
    }
    // BUFFERING is left alone so the cover doesn't flicker mid-seek
  }
 
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
 
  function render(){
    if (!player || !player.getDuration) return;
    var d = player.getDuration() || 0;
    var t = player.getCurrentTime() || 0;
    if (!dragging){
      var pct = d ? (t / d) * 100 : 0;
      fill.style.width = pct + '%';
      knob.style.left  = pct + '%';
    }
    timeEl.textContent = fmt(t) + ' / ' + fmt(d);
  }
 
  function flip(){
    if (!player || !player.getPlayerState) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
  }
 
  cover.addEventListener('click',  function(e){ e.stopPropagation(); player && player.playVideo(); });
  shield.addEventListener('click', flip);
  toggle.addEventListener('click', function(e){ e.stopPropagation(); flip(); });
 
  muteBt.addEventListener('click', function(e){
    e.stopPropagation();
    if (!player) return;
    if (player.isMuted()){ player.unMute(); muteP.setAttribute('d', SPK); }
    else { player.mute(); muteP.setAttribute('d', MUTED); }
  });
 
  function seekFrom(clientX){
    var r = scrub.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    fill.style.width = (pct * 100) + '%';
    knob.style.left  = (pct * 100) + '%';
    return pct;
  }
 
  scrub.addEventListener('pointerdown', function(e){
    e.stopPropagation(); dragging = true;
    scrub.setPointerCapture(e.pointerId); seekFrom(e.clientX);
  });
  scrub.addEventListener('pointermove', function(e){ if (dragging) seekFrom(e.clientX); });
  scrub.addEventListener('pointerup', function(e){
    if (!dragging) return;
    dragging = false;
    if (player && player.getDuration) player.seekTo(seekFrom(e.clientX) * player.getDuration(), true);
  });
})();
</script>
</body>
</html>
